<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Linux Filesystem Tree</title>
  <desc id="desc">Overview of important Linux directories for DevOps beginners.</desc>
  <rect width="1200" height="720" rx="28" fill="#0b1220"/>
  <text x="60" y="70" fill="#e5eefb" font-family="Arial, sans-serif" font-size="34" font-weight="700">Linux Filesystem</text>
  <text x="60" y="108" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">Mọi thứ bắt đầu từ root directory /</text>

  <g font-family="Arial, sans-serif">
    <rect x="520" y="145" width="160" height="70" rx="18" fill="#13322b" stroke="#34d399"/>
    <text x="600" y="190" text-anchor="middle" fill="#6ee7b7" font-size="28" font-weight="700">/</text>

    <g stroke="#475569" stroke-width="3" fill="none">
      <path d="M600 215V255"/>
      <path d="M130 255H1070"/>
      <path d="M130 255V295"/><path d="M290 255V295"/><path d="M450 255V295"/><path d="M610 255V295"/><path d="M770 255V295"/><path d="M930 255V295"/><path d="M1070 255V295"/>
    </g>

    <g text-anchor="middle">
      <g><rect x="65" y="295" width="130" height="78" rx="16" fill="#132238"/><text x="130" y="326" fill="#60a5fa" font-size="20" font-weight="700">/etc</text><text x="130" y="353" fill="#cbd5e1" font-size="14">config</text></g>
      <g><rect x="225" y="295" width="130" height="78" rx="16" fill="#132238"/><text x="290" y="326" fill="#60a5fa" font-size="20" font-weight="700">/var</text><text x="290" y="353" fill="#cbd5e1" font-size="14">logs + state</text></g>
      <g><rect x="385" y="295" width="130" height="78" rx="16" fill="#132238"/><text x="450" y="326" fill="#60a5fa" font-size="20" font-weight="700">/home</text><text x="450" y="353" fill="#cbd5e1" font-size="14">users</text></g>
      <g><rect x="545" y="295" width="130" height="78" rx="16" fill="#132238"/><text x="610" y="326" fill="#60a5fa" font-size="20" font-weight="700">/usr</text><text x="610" y="353" fill="#cbd5e1" font-size="14">programs</text></g>
      <g><rect x="705" y="295" width="130" height="78" rx="16" fill="#132238"/><text x="770" y="326" fill="#60a5fa" font-size="20" font-weight="700">/opt</text><text x="770" y="353" fill="#cbd5e1" font-size="14">3rd-party app</text></g>
      <g><rect x="865" y="295" width="130" height="78" rx="16" fill="#132238"/><text x="930" y="326" fill="#60a5fa" font-size="20" font-weight="700">/tmp</text><text x="930" y="353" fill="#cbd5e1" font-size="14">temporary</text></g>
      <g><rect x="1010" y="295" width="125" height="78" rx="16" fill="#132238"/><text x="1072" y="326" fill="#60a5fa" font-size="20" font-weight="700">/root</text><text x="1072" y="353" fill="#cbd5e1" font-size="14">root home</text></g>
    </g>

    <g stroke="#475569" stroke-width="3" fill="none">
      <path d="M290 373V415"/><path d="M230 415H350"/><path d="M230 415V450"/><path d="M350 415V450"/>
      <path d="M610 373V450"/>
    </g>

    <g text-anchor="middle">
      <g><rect x="165" y="450" width="130" height="72" rx="14" fill="#101d30"/><text x="230" y="480" fill="#fbbf24" font-size="18" font-weight="700">/var/log</text><text x="230" y="505" fill="#cbd5e1" font-size="13">logs</text></g>
      <g><rect x="285" y="450" width="130" height="72" rx="14" fill="#101d30"/><text x="350" y="480" fill="#fbbf24" font-size="18" font-weight="700">/var/lib</text><text x="350" y="505" fill="#cbd5e1" font-size="13">service data</text></g>
      <g><rect x="545" y="450" width="130" height="72" rx="14" fill="#101d30"/><text x="610" y="480" fill="#fbbf24" font-size="18" font-weight="700">/usr/bin</text><text x="610" y="505" fill="#cbd5e1" font-size="13">commands</text></g>
    </g>

    <rect x="65" y="585" width="1070" height="82" rx="18" fill="#101d30" stroke="#334155"/>
    <text x="95" y="618" fill="#6ee7b7" font-size="18" font-weight="700">Các thư mục runtime/device quan trọng:</text>
    <text x="95" y="648" fill="#cbd5e1" font-size="16">/proc  process/kernel runtime   •   /sys  kernel/device   •   /dev  devices   •   /mnt  mount thủ công   •   /media  removable media</text>
  </g>
</svg>
